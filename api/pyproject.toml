[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle: PEP 8のスタイル違反
  "F",        # Pyflakes: 未使用のimport/変数、未定義名
  "I",        # isort: importの並び順
  "UP",       # pyupgrade: 古い書き方を新しい構文へ(Optional[str] → str | None など)
  "B",        # flake8-bugbear: 実際に事故につながりやすい書き方の検出
  "ASYNC",    # flake8-async: 非同期コードのアンチパターン検出
  "S",        # flake8-bandit: セキュリティ観点の検査
]
ignore = [
  "S101",     # assertの使用。テストコードでは当然使うので許可する
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]   # テスト内のダミーパスワード文字列を許可
