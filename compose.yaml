# ローカル開発専用の構成。--reloadやbind mountなど開発の利便性のための設定を含む。
# 本番はこのファイルを経由せず、Bicep + Container Appsで別途デプロイする予定

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432" # CIでは環境変数から注入、開発環境では環境変数ないので既定値の5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck: # 3秒おきに生存チェック
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api # ./api/Dockerfile からbuildしてイメージを作る
      target: dev # ruff/pytest等の開発ツールを含むdevステージを使う(本番はproductionステージ)
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;" # Azurite公式の固定値なので平文で問題なし
      AZURE_STORAGE_CONTAINER: reports
      AZURE_STORAGE_PUBLIC_ENDPOINT: "http://localhost:10000/devstoreaccount1"
    volumes:
      - ./api:/app # /app全体をホストのapi/で覆う（bind mount）ことでホスト側でコードを編集した瞬間、コンテナの/appにも即座に反映される（--reloadとの合わせ技）
      # 仮想環境はDockerfileで/opt/venvに作っており、このバインドマウントの範囲外
      # （ホスト側のapi/.venvは/app/.venvとして見えるがPATHが通っていないため参照されない）
    depends_on:
      db: # dbが起動完了してからapiを起動
        condition: service_healthy
      azurite:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      API_URL_INTERNAL: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next # ビルド生成物
    depends_on:
      - api

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: >
      azurite --blobHost 0.0.0.0 --blobPort 10000
              --queueHost 0.0.0.0 --queuePort 10001
              --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
    volumes:
      - azuritedata:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 && nc -z 127.0.0.1 10001"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes: # 名前つきボリュームの実体を宣言すると作成してくれる
  pgdata:
  frontend_node_modules:
  frontend_next:
  azuritedata:
