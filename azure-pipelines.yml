trigger:
  branches:
    include: [main]
  paths:
    include: [api/**, frontend/**, azure-pipelines.yml]

pr:
  branches:
    include: [main]

variables:
  - name: acrName
    value: resagentacr
  - name: rgName
    value: rg-research-agent
  - name: azureServiceConnection
    value: sc-research-agent # AzDO の Project Settings > Service connections で作成した名前

stages:
  - stage: CI
    displayName: lint & test
    jobs:
      - job: api
        pool: { vmImage: ubuntu-latest }
        steps:
          - script: |
              cp .env.example .env
              cp api/.env.example api/.env
              cat >> .env <<'EOF'
              COMPOSE_PROJECT_NAME=research-agent-ci
              DB_PORT=15432
              API_PORT=18000
              FRONTEND_PORT=13001
              EOF
            displayName: prepare .env (開発環境と衝突しないポートに退避) # TODO: 現状、開発専用の値しかないのでそのままコピーしているが、秘密情報を扱う際にはシークレット変数から注入する形に変える
          - script: make up
            displayName: start containers (docker compose)
          - script: make test-db
            displayName: create test database
          - script: make ci-api
            displayName: lint & test (apiコンテナ内で実行)
          - script: docker compose cp api:/tmp/results.xml api/results.xml
            condition: always()
            displayName: copy test results from container
          - task: PublishTestResults@2 # https://learn.microsoft.com/ja-jp/azure/devops/pipelines/tasks/reference/publish-test-results-v2?view=azure-pipelines&tabs=trx%2Ctrxattachments%2Cyaml
            condition: always()
            inputs:
              testResultsFiles: api/results.xml
            displayName: publish test results
          - script: make down-clean
            condition: always()
            displayName: cleanup (ボリュームごと破棄)

      - job: frontend
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: UseNode@1 # https://learn.microsoft.com/ja-jp/azure/devops/pipelines/tasks/reference/use-node-v1?view=azure-pipelines
            inputs: { version: "24.x" } # volta pin / Dockerfileと揃える
          - script: |
              cd frontend
              npm ci
              npm run format:check
              npm run lint
              npm run build
            displayName: lint & build (frontend)

  # ---- ここからCD: mainへのマージ時だけ実行 ----
  - stage: Build
    displayName: build images to ACR
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main')) # CIが成功かつmainのbuild時のみ実行（PR作成時はskip）
    jobs:
      - job: build_images
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: AzureCLI@2 # https://learn.microsoft.com/ja-jp/azure/devops/pipelines/tasks/reference/azure-cli-v2?view=azure-pipelines
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              # set -euo pipefail: https://zenn.dev/pollenjp/articles/2026-03-29-bash-safe-scripting
              inlineScript: |
                set -euo pipefail
                az acr build -r $(acrName) -t api:$(Build.BuildId) --target production ./api
                az acr build -r $(acrName) -t frontend:$(Build.BuildId) ./frontend
            displayName: az acr build (api / frontend)

  - stage: Migrate
    displayName: alembic upgrade head
    dependsOn: Build
    jobs:
      - job: alembic
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Jobの定義を新しいイメージへ更新する。
                az containerapp job update -n api-migrate -g $(rgName) \
                  --image $(acrName).azurecr.io/api:$(Build.BuildId) --output none

                # 起動し、マイグレーションを実行する
                EXEC=$(az containerapp job start -n api-migrate -g $(rgName) \
                  --query name -o tsv)
                echo "started: $EXEC"

                # 上記startは「起動した」時点で返るため、migrationが失敗してもこのステージが緑になってしまうのを防ぐために完了を待つ（60*10sec=最大10min）
                for i in $(seq 1 60); do
                  STATUS=$(az containerapp job execution show -n api-migrate -g $(rgName) \
                    --job-execution-name "$EXEC" --query properties.status -o tsv)
                  echo "execution $EXEC: $STATUS"
                  [ "$STATUS" = "Succeeded" ] && exit 0
                  [ "$STATUS" = "Failed" ] && exit 1
                  sleep 10
                done
                echo "migration timed out"; exit 1
            displayName: run api-migrate job and wait

  - stage: Deploy
    displayName: update container apps
    dependsOn: Migrate
    jobs:
      - deployment: deploy_api # deploy専用のjob
        environment: production # AzDOのEnvironmentと紐づける
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az containerapp update -n api -g $(rgName) \
                        --image $(acrName).azurecr.io/api:$(Build.BuildId) --output none
                      az containerapp update -n frontend -g $(rgName) \
                        --image $(acrName).azurecr.io/frontend:$(Build.BuildId) --output none
                      az containerapp job update -n research-worker -g $(rgName) \
                        --image $(acrName).azurecr.io/api:$(Build.BuildId) --output none
                      # api-migrateはMigrateステージで更新済
                  displayName: update api / frontend / research-worker
